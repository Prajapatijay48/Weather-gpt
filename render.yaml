services:
  - type: web
    name: weather-gpt-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
