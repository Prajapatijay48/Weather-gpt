<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Weather-GPT — AI-Powered Weather Assistant</title>
  <meta name="description" content="Weather-GPT combines real-time weather insights, visual analytics and an AI-style assistant into one simple experience." />
  <meta name="theme-color" content="#0A0F1D" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Core Theme & Layout Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <!-- External Libraries (Zero build step, CDN-backed) -->
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for in-browser JSX compilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- GSAP for subtle animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <!-- Root React Mount Target -->
  <div id="root">
    <!-- Instant Fallback Loading Shell -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #080C14; color: #94A3B8; font-family: 'Inter', sans-serif; gap: 16px;">
      <div style="width: 44px; height: 44px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38BDF8; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div style="font-size: 1.1rem; font-weight: 600; color: #F8FAFC;">Loading Weather-GPT...</div>
      <div style="font-size: 0.85rem; color: #64748B;">Initializing telemetry and AI assistant model</div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
  </div>

  <!-- Application Mock Data & AI Engine -->
  <script src="js/data.js"></script>

  <!-- Reusable React Components (Compiled by Babel) -->
  <script type="text/babel" src="js/components.js"></script>

  <!-- Main App Entry & State Controller -->
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
